[package]
name    = "rust-sensor-node"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rust-sensor-node"
path = "src/main.rs"

# ── Target ────────────────────────────────────────────────────────────────────
# Arduino Nano Every uses the ATmega4809 (AVR, 8-bit, 20 MHz).
# Target triple: avr-unknown-gnu-atmega4809
# Requires nightly Rust and the avr-hal ecosystem.

[dependencies]
# Hardware abstraction layer for AVR microcontrollers.
# Provides register-level access to peripherals behind embedded-hal traits.
arduino-hal = { git = "https://github.com/Rahix/avr-hal", rev = "65b304ec974a13f27ebc2ced21aa462c4b81ce82", features = ["arduino-nano"] }

# embedded-hal trait definitions (version 0.2 — what avr-hal implements).
embedded-hal = "0.2"
nb = "1.0"

# DHT22 driver — implements the single-wire protocol using embedded-hal
# digital I/O and delay traits. no_std compatible.
dht-sensor = "0.2"

# SSD1306 OLED driver — implements I2C framebuffer display using
# embedded-hal I2C traits. no_std compatible.
ssd1306 = "0.8"

# Embedded graphics — text rendering and drawing primitives. no_std.
embedded-graphics = "0.8"

# Panic handler for AVR no_std: halts on panic (no heap, no formatting).
panic-halt = "0.2"

[profile.dev]
# AVR has 6 KB SRAM (ATmega4809). Optimise for size even in dev builds.
opt-level = "s"
lto        = true
panic      = "abort"

[profile.release]
opt-level = "s"
lto        = true
panic      = "abort"
codegen-units = 1
