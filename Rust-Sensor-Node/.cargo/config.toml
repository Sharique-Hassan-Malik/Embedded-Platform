# .cargo/config.toml
#
# Build configuration for the ATmega4809 (Arduino Nano Every).
# avr-gcc must be installed on the host (via avr-gcc package or Arduino IDE).

[build]
target = "avr-atmega328p.json"

[target.'cfg(target_arch = "avr")']
# avr-gcc linker with AVR-specific flags.
linker = "avr-gcc"
ar     = "avr-ar"

rustflags = [
    # Target MCU — must match the Cargo.toml feature flag.
    "-C", "target-cpu=atmega328p",
    # Use avr-gcc as the linker driver.
    "-C", "linker=avr-gcc",
    # Optimise for size.
    "-C", "opt-level=s",
    # Link-time optimisation.
    "-C", "lto=true",
    # Emit a .elf file (avr-gcc default).
]

# ravedude is a Cargo runner that flashes the ELF to the Arduino via avrdude.
# Install with: cargo install ravedude
runner = "ravedude nano -cb 115200"

[unstable]
build-std = ["core"]
